#/etc/hosts
x-hosts: &hosts
  - store.local.55haitao.com:${NGINX_IP}

services:
  nginx:
    image: nginx:${NGINX_VERSION}
    container_name: nginx
    ports:
      - "${NGINX_HTTP_HOST_PORT}:80"
      - "${NGINX_HTTPS_HOST_PORT}:443"
    volumes:
      - ${SOURCE_DIR}:/www/:rw
      - ${NGINX_SSL_CERTIFICATE_DIR}:/etc/nginx/ssl:rw
      - ${NGINX_CONFD_DIR}:/etc/nginx/conf.d/:rw
      - ${NGINX_CONF_FILE}:/etc/nginx/nginx.conf:ro
      - ${NGINX_FASTCGI_PHP_CONF}:/etc/nginx/fastcgi-php.conf:ro
      - ${NGINX_FASTCGI_PARAMS}:/etc/nginx/fastcgi_params:ro
      - ${NGINX_FASTCGI_CONF}:/etc/nginx/fastcgi.conf:ro
      - ${NGINX_LOG_DIR}:/var/log/nginx/:rw
    environment:
      TZ: "$TZ"
    restart: always
    networks:
      # - default
      # 可以把-default 改成下列配置，以固定容器IP
      default:
        ipv4_address: ${NGINX_IP}

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ${SOURCE_DIR}:/www/:rw
      - ./services/nginx/ssl/:/etc/letsencrypt/:rw
    networks:
      default:
        ipv4_address: ${CERTBOT_IP}

  php83:
    image: ${REPOSITORY}/php:${PHP83_VERSION}
    container_name: php83
    expose:
      - 9501
    volumes:
      - ${SOURCE_DIR}:/www/:rw
      - ${PHP83_PHP_CONF_FILE}:/usr/local/etc/php/php.ini:ro
      - ${PHP83_FPM_CONF_FILE}:/usr/local/etc/php-fpm.d/www.conf:rw
      - ${PHP83_LOG_DIR}:/var/log/php
      - ${DATA_DIR}/composer:/tmp/composer
    extra_hosts: *hosts
    restart: always
    cap_add:
      - SYS_PTRACE
    networks:
      - default

  mysql:
    image: mysql:${MYSQL_VERSION}
    container_name: mysql
    ports:
      - "${MYSQL_HOST_PORT}:3306"
    volumes:
      - ${MYSQL_CONF_FILE}:/etc/mysql/conf.d/mysql.cnf:ro
      - ${DATA_DIR}/mysql:/var/lib/mysql/:rw
      - ${MYSQL_LOG_DIR}:/var/log/mysql/:rw
    restart: always
    networks:
      - default
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_ROOT_HOST: "${MYSQL_ROOT_HOST}"
      TZ: "$TZ"

  redis:
    image: redis:${REDIS_VERSION}
    container_name: redis
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - ${REDIS_CONF_FILE}:/etc/redis.conf:ro
      - ${DATA_DIR}/redis:/data/:rw
    restart: always
    entrypoint: ["redis-server", "/etc/redis.conf"]
    environment:
      TZ: "$TZ"
    networks:
      default:
        ipv4_address: ${REDIS_IP}


  qdrant:
    image: qdrant/qdrant:dev  # 建议固定版本
    container_name: qdrant
    ports:
      - "${QDRANT_HTTP_PORT}:6333"  # HTTP API 端口
      - "${QDRANT_GRPC_PORT}:6334"  # gRPC 端口（可选）
    volumes:
      - ${DATA_DIR}/qdrant/storage:/qdrant/storage  # 数据持久化
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - TZ=${TZ}
    networks:
      default:
        ipv4_address: ${QDRANT_IP}

  postgresql:
    build:
      context: ./services/postgresql
      args:
        POSTGRES_VERSION: 18
    image: postgres:18-pg-partman
    container_name: postgresql
    ports:
      - "${POSTGRESQL_HOST_PORT}:5432"
    volumes:
      - ${DATA_DIR}/postgresql:/var/lib/postgresql:rw
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRESQL_USER}"
      POSTGRES_PASSWORD: "${POSTGRESQL_PASSWORD}"
      POSTGRES_DB: "${POSTGRESQL_DB}"
      TZ: "$TZ"
    networks:
      - default

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123"  # HTTP 接口
      - "9000:9000"  # Native 接口
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse:rw
      - ./services/clickhouse/config.xml:/etc/clickhouse-server/config.d/custom.xml:ro
      - ./services/clickhouse/users.xml:/etc/clickhouse-server/users.d/custom_users.xml:ro
    environment:
      CLICKHOUSE_DB: default
      TZ: "$TZ"
    restart: always
    networks:
      default:
        ipv4_address: ${CLICKHOUSE_IP:-10.0.0.14}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
  rabbitmq:
    build:
      context: ./services/rabbitmq
      args:
        RABBITMQ_VERSION: ${RABBITMQ_VERSION}
        RABBITMQ_PLUGINS: ${RABBITMQ_PLUGINS}
    container_name: rabbitmq
    restart: always
    ports:
      - "${RABBITMQ_HOST_PORT_C}:5672"
      - "${RABBITMQ_HOST_PORT_S}:15672"
    environment:
        TZ: "$TZ"
        RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER}"
        RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS}"
    networks:
          - default

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      # 解除下面的注释可以设置网段，用于nginx等容器固定容器IP
      config:
        - subnet: ${SUBNET_IP}
