server {
	listen		80;
	listen		443 ssl;
	server_name r.test.com;

	ssl_certificate     /etc/nginx/ssl/_wildcard.test.com+1.pem;
	ssl_certificate_key /etc/nginx/ssl/_wildcard.test.com+1-key.pem;

	charset utf-8;

	add_header X-Frame-Options "SAMEORIGIN";
	add_header X-XSS-Protection "1; mode=block";
	add_header X-Content-Type-Options "nosniff";
	add_header Strict-Transport-Security "max-age=31536000";
	add_header Access-Control-Allow-Origin 	*;
	add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE';
	add_header Access-Control-Allow-Headers 'Accept,Accept-Encoding,Accept-Language,Proxy-Connection,Host,Origin,Referer,User-Agent,Content-Type';
	add_header 'Access-Control-Max-Age' 1728000;

	if ($request_method = 'OPTIONS') {
		return 204;
	}

	location / {
		proxy_pass         http://host.docker.internal:10000;
		proxy_http_version 1.1;
		proxy_set_header   Host              $host;
		proxy_set_header   X-Real-IP         $remote_addr;
		proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header   X-Forwarded-Proto $scheme;
	}

	access_log   /var/log/nginx/r.test.com.access.log main;
	error_log    /var/log/nginx/r.test.com.error.log warn;
}
